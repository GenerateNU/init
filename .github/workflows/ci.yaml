---
name: ci

on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: check out repository
        uses: actions/checkout@v4
      - name: install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: activate devshell
        run: nix develop --impure
      - name: check Python formatting
        run: black --check .
      - name: lint shell scripts
        run: find . -type f -name '*.sh' | xargs shellcheck
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: check out repository
        uses: actions/checkout@v4
      - name: install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: activate devshell
        run: nix develop --impure
      - name: test
        run: echo TODO && exit 1
  e2e-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: check out repository
        uses: actions/checkout@v4
      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install dependencies
        run: pip3 install -r cli/requirements.txt
      - name: install expect on ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y expect
      - name: install expect on macos
        if: matrix.os == 'macos-latest'
        run: brew install expect
      - name: run e2e test shell script
        run: |
          chmod +x scripts/e2e_test.sh
          ./scripts/e2e_test.sh
